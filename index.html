<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070b" />
    <meta name="description" content="Ride inside a web request and explore what happens after you press Enter on google.com." />
    <title>What happens when you hit Enter?</title>
  </head>
  <body>
    <main id="app" aria-label="Interactive 3D packet journey">
      <canvas id="world" aria-hidden="true"></canvas>
      <div id="vignette" aria-hidden="true"></div>
      <header class="topbar">
        <a class="brand" href="#/" aria-label="Return to intro">
          <span class="brand-packet"></span>
          <span>PACKET / 001</span>
        </a>
        <button id="mode-toggle" class="mode-toggle" type="button" aria-label="Switch explanation mode" aria-pressed="false">
          <span data-mode-label>Easy mode</span><span class="toggle-track"><i></i></span>
        </button>
      </header>
      <section id="loader" class="loader" aria-live="polite">
        <p>Routing packet</p><div class="loader-track"><i></i></div><span>Preparing the path…</span>
      </section>
      <section id="hero" class="hero is-hidden" aria-labelledby="hero-title">
        <p id="hero-eyebrow" class="eyebrow"></p>
        <h1 id="hero-title"></h1>
        <p id="hero-body"></p>
        <button id="start-button" class="start-button" type="button"><span>Press</span> Enter <i>↵</i></button>
      </section>
      <div id="hero-browser" class="hero-browser is-hidden" aria-hidden="true">
        <div class="browser-chrome"><i></i><i></i><i></i></div>
        <div class="browser-address"><span>⌕</span><b>google.com</b><i></i></div>
        <div class="browser-empty"><span></span><span></span><span></span></div>
      </div>
      <section id="chapter" class="chapter is-hidden" aria-live="polite">
        <p id="chapter-index"></p><h2 id="chapter-title"></h2><p id="chapter-kicker"></p>
      </section>
      <div id="hotspots" class="hotspots" aria-label="Scene hotspots"></div>
      <svg id="leader-layer" class="leader-layer" aria-hidden="true"><line id="leader-line" /></svg>
      <aside id="info-card" class="info-card" aria-live="polite" aria-hidden="true">
        <button id="card-close" class="card-close" type="button" aria-label="Close explanation">×</button>
        <p id="card-label" class="card-label"></p><h2 id="card-title"></h2><div id="card-body" class="card-body"></div>
        <blockquote id="interview-line"></blockquote>
        <div id="card-sources" class="card-sources"></div>
        <button id="continue-button" class="continue-button" type="button">Continue <span>→</span></button>
      </aside>
      <section id="finale" class="finale is-hidden" aria-live="polite">
        <p id="finale-eyebrow" class="eyebrow"></p><p class="timer"><span id="timer-value">0</span><small>ms</small></p>
        <h2 id="finale-title"></h2><p id="finale-body"></p>
        <button id="replay-button" class="start-button" type="button">Ride again <i>↻</i></button>
      </section>
      <nav id="progress" class="progress" aria-label="Packet journey"></nav>
      <footer><a href="https://github.com/alex/what-happens-when" target="_blank" rel="noreferrer">Based on what-happens-when ↗</a><a href="https://github.com/debuu0007/whathappensgoogle" target="_blank" rel="noreferrer">Source code ↗</a><button id="share-button" type="button">Share this hop ↗</button><span>Drag to look · ← → to travel · Esc to exit</span></footer>
      <div id="live-region" class="sr-only" aria-live="assertive"></div>
    </main>
    <noscript>This journey needs JavaScript and WebGL to run.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
